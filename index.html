<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .task-card { transition: all 0.3s ease; }
        .task-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        .completed { text-decoration: line-through; opacity: 0.6; }
        .priority-badge { font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 9999px; }
        .priority-high { background-color: #FECACA; color: #991B1B; }
        .priority-medium { background-color: #FEF3C7; color: #92400E; }
        .priority-low { background-color: #D1FAE5; color: #065F46; }

        /* Gaya tambahan */
        #chatbot-fab, #settings-fab { position: fixed; bottom: 2rem; transition: all 0.3s ease; z-index: 40; }
        #chatbot-fab { right: 2rem; }
        #settings-fab { right: 6.5rem; }
        #chatbot-fab:hover, #settings-fab:hover { transform: scale(1.1); }
        #chatbot-modal, #settings-modal { background-color: rgba(0, 0, 0, 0.5); }
        .chat-bubble { max-width: 80%; padding: 0.75rem 1rem; border-radius: 1rem; }
        .chat-bubble-user { background-color: #3B82F6; color: white; border-bottom-right-radius: 0.25rem; align-self: flex-end; }
        .chat-bubble-bot { background-color: #E5E7EB; color: #1F2937; border-bottom-left-radius: 0.25rem; align-self: flex-start; }
        .comparison-label { width: 100px; text-align: right; }
        .comparison-slider { flex-grow: 1; margin: 0 1rem; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="app-container" class="max-w-4xl mx-auto p-4 md:p-8">
        
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-900">Prio</h1>
            <p class="mt-2 text-slate-600">Asisten cerdas untuk memprioritaskan tugas kuliah Anda.</p>
        </header>

        <!-- UI Login -->
        <div id="auth-container" class="mb-6 text-center">
            <div id="login-view">
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <button id="login-button" class="bg-white text-slate-700 font-semibold py-2 px-6 border border-slate-300 rounded-lg shadow-sm hover:bg-slate-100 transition-colors flex items-center justify-center w-full sm:w-auto">
                        <svg class="w-5 h-5 mr-3" viewBox="0 0 48 48" width="48px" height="48px"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.574l6.19,5.238C39.902,36.632,44,30.852,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path></svg>
                        Login dengan Google
                    </button>
                    <button id="guest-login-button" class="bg-slate-600 text-white font-semibold py-2 px-6 rounded-lg shadow-sm hover:bg-slate-700 transition-colors w-full sm:w-auto">
                        Masuk sebagai Tamu
                    </button>
                </div>
            </div>
            <div id="user-view" class="hidden">
                 <p class="text-sm text-slate-500 mb-2">Login sebagai <strong id="user-email"></strong></p>
                 <button id="logout-button" class="bg-red-500 text-white font-semibold py-1 px-4 text-sm rounded-lg hover:bg-red-600 transition-colors">Logout</button>
            </div>
        </div>

        <!-- Konten Utama -->
        <main id="main-content" class="hidden">
            <div class="bg-white p-6 rounded-xl shadow-md mb-8">
                <h2 class="text-xl font-semibold mb-4">Tambah Tugas (Manual)</h2>
                <!-- Form input -->
                <form id="task-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                     <div class="md:col-span-2"><label for="task-name" class="block text-sm font-medium text-slate-700 mb-1">Nama Tugas</label><input type="text" id="task-name" placeholder="Contoh: Laporan Praktikum Jaringan Komputer" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                    <div>
                        <label for="task-urgency" class="block text-sm font-medium text-slate-700 mb-1">Urgensi</label>
                        <input type="range" id="task-urgency" min="1" max="5" value="3" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                        <span id="urgency-value" class="text-sm text-slate-500">3 (Lusa)</span>
                    </div>
                    <div>
                        <label for="task-importance" class="block text-sm font-medium text-slate-700 mb-1">Pentingnya</label>
                        <input type="range" id="task-importance" min="1" max="5" value="3" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                        <span id="importance-value" class="text-sm text-slate-500">3 (Tugas Besar)</span>
                    </div>
                    <div class="md:col-span-2"><label for="task-time" class="block text-sm font-medium text-slate-700 mb-1">Estimasi Waktu (Jam)</label><input type="number" id="task-time" min="0.5" step="0.5" value="1" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                    <div class="md:col-span-2"><button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">Prioritaskan & Tambah</button></div>
                </form>
                 <p id="current-weights-display" class="text-xs text-slate-400 mt-4 text-center">Bobot saat ini: Urgensi=3.5, Pentingnya=2.5, Waktu=-0.5</p>
            </div>
            
            <div>
                <!-- Daftar Tugas & Panel Admin -->
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">Daftar Tugas Anda (Diurutkan)</h2>
                </div>
                <div id="admin-panel" class="hidden bg-yellow-50 border border-yellow-200 p-4 rounded-lg mb-6">
                   <!-- Panel Admin -->
                   <h3 class="text-lg font-semibold text-yellow-900">Panel Admin</h3>
                   <p class="text-sm text-yellow-700 mb-3">Pilih pengguna untuk mengunduh data tugas mereka.</p>
                   <div class="flex flex-col sm:flex-row gap-2">
                       <label for="user-select-dropdown" class="sr-only">Pilih pengguna</label>
                       <select id="user-select-dropdown" class="grow px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                           <option value="">Memuat daftar pengguna...</option>
                       </select>
                       <button id="download-button" class="bg-green-600 text-white text-sm font-semibold py-2 px-4 rounded-lg hover:bg-green-700 transition-colors flex items-center justify-center gap-2">
                           <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                           Download Data
                       </button>
                   </div>
                </div>
                <div id="task-list" class="space-y-4">
                    <p id="loading-tasks" class="text-slate-500 text-center">Memuat tugas...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Tombol FAB -->
    <button id="chatbot-fab" class="hidden bg-blue-600 text-white p-4 rounded-full shadow-lg" title="Buka Asisten Tugas" aria-label="Buka Asisten Tugas">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
        <span class="sr-only">Buka Asisten Tugas</span>
    </button>
    <button id="settings-fab" class="hidden bg-gray-700 text-white p-4 rounded-full shadow-lg" title="Atur Bobot (AHP)" aria-label="Atur Bobot Prioritas">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <span class="sr-only">Atur Bobot Prioritas</span>
    </button>

    <!-- Modal Chatbot -->
    <div id="chatbot-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <!-- ... (Konten Modal Chatbot) ... -->
    </div>

    <!-- Modal Settings (AHP Sederhana) -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <!-- ... (Konten Modal Settings) ... -->
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp, doc, updateDoc, deleteDoc, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4WwUhxG5XROTr5lSHvhDS4zj2Lqmw1U0",
            authDomain: "asisten-tugas-pribadi.firebaseapp.com",
            projectId: "asisten-tugas-pribadi",
            storageBucket: "asisten-tugas-pribadi.appspot.com",
            messagingSenderId: "994319187177",
            appId: "1:994319187177:web:58ebbc1fce8645eabd4478"
        };
        
        document.addEventListener('DOMContentLoaded', () => {
            console.log("[DEBUG] DOM loaded. Initializing script.");

            // Inisialisasi Firebase
            let db, auth, userId, unsubscribeTasks;
            let pendingTaskData = null; 
            const appId = 'asisten-tugas-pribadi';
            let app; 
            try {
                app = initializeApp(firebaseConfig); 
                db = getFirestore(app);
                auth = getAuth(app);
                console.log("[DEBUG] Firebase initialized.");
            } catch (error) {
                 console.error("!!! FATAL: Firebase Initialization Failed !!!", error);
                 alert("Initialization Error: " + error.message);
                 return; 
            }

            // Bobot AHP
            let weights = null; // *** PERBAIKAN: Inisialisasi null agar load jelas ***
            const defaultWeights = { urgency: 3.5, pentingnya: 2.5, time: -0.5 }; // Bobot default
            const currentWeightsDisplayApp = document.getElementById('current-weights-display');

            // --- Fungsi utilitas untuk menambah event listener dengan aman ---
            function safeAddEventListener(elementId, event, handler) {
                const element = document.getElementById(elementId);
                if (element) {
                    element.addEventListener(event, handler);
                } else {
                    console.error(`!!! KRITIS: Elemen dengan ID "${elementId}" tidak ditemukan.`);
                }
            }

            // --- Logika Label Slider Manual ---
            const urgencyLabels = { 1: 'Santai (> Seminggu)', 2: 'Minggu Ini', 3: 'Lusa', 4: 'Besok', 5: 'Hari Ini (Mendesak)' };
            const importanceLabels = { 1: 'Catatan', 2: 'Tugas Harian', 3: 'Tugas Besar/Projek', 4: 'Kuis/Presentasi', 5: 'Ujian/Final' };
            safeAddEventListener('task-urgency', 'input', (e) => { 
                const valueSpan = document.getElementById('urgency-value');
                if(valueSpan) valueSpan.textContent = `${e.target.value} (${urgencyLabels[e.target.value]})`; 
            });
            safeAddEventListener('task-importance', 'input', (e) => { 
                const valueSpan = document.getElementById('importance-value');
                if(valueSpan) valueSpan.textContent = `${e.target.value} (${importanceLabels[e.target.value]})`; 
            });

            // --- Fungsi Admin ---
            const checkAdminStatus = async (user) => { 
                if (!user || user.isAnonymous) return false;
                const userDocRef = doc(db, "users", user.uid);
                try {
                    const userDoc = await getDoc(userDocRef);
                    return userDoc.exists() && userDoc.data().isAdmin === true;
                } catch (error) {
                    console.error("Gagal memeriksa status admin:", error);
                    return false;
                }
            };
            const loadUserListForAdmin = async () => { 
                 const adminPanel = document.getElementById('admin-panel');
                 const userSelectDropdown = document.getElementById('user-select-dropdown');
                 if (!adminPanel || !userSelectDropdown) return;
                 adminPanel.classList.add('hidden'); 
                 try {
                     const usersCollectionRef = collection(db, "users");
                     const snapshot = await getDocs(usersCollectionRef);
                     userSelectDropdown.innerHTML = ''; 
                     if (snapshot.empty) {
                         userSelectDropdown.innerHTML = '<option value="">Tidak ada pengguna</option>';
                         return;
                     }
                     snapshot.forEach(doc => {
                         const userData = doc.data();
                         const userId = doc.id;
                         const userName = userData.email || `Tamu (${userId.substring(0, 8)}...)`;
                         const option = document.createElement('option');
                         option.value = userId;
                         option.textContent = userName;
                         userSelectDropdown.appendChild(option);
                     });
                     adminPanel.classList.remove('hidden'); 
                 } catch (error) {
                     console.error("[DEBUG] Gagal memuat daftar pengguna:", error);
                     adminPanel.innerHTML = `<p class="text-red-600">Gagal memuat daftar pengguna. (Perlu Security Rules Admin)</p>`;
                     adminPanel.classList.remove('hidden');
                 }
            };


            // --- Otak Aplikasi: onAuthStateChanged ---
            onAuthStateChanged(auth, async (user) => {
                 const adminPanel = document.getElementById('admin-panel');
                 const chatbotFab = document.getElementById('chatbot-fab');
                 const settingsFab = document.getElementById('settings-fab');
                 const loginView = document.getElementById('login-view');
                 const userView = document.getElementById('user-view');
                 const mainContent = document.getElementById('main-content');
                 const userEmailSpan = document.getElementById('user-email');

                 if(adminPanel) adminPanel.classList.add('hidden');
                 if(chatbotFab) chatbotFab.classList.add('hidden');
                 if(settingsFab) settingsFab.classList.add('hidden');

                if (user) {
                    userId = user.uid; 
                    if(userEmailSpan) userEmailSpan.innerHTML = user.isAnonymous ? `Tamu (${user.uid.substring(0, 6)}...)` : user.email;
                    if(loginView) loginView.classList.add('hidden');
                    if(userView) userView.classList.remove('hidden');
                    if(mainContent) mainContent.classList.remove('hidden');
                    if(chatbotFab) chatbotFab.classList.remove('hidden'); 
                    if(settingsFab) settingsFab.classList.remove('hidden'); 
                    
                    if (await checkAdminStatus(user)) {
                        loadUserListForAdmin(); 
                    }
                    loadWeights(); // Muat bobot setelah login
                    listenToTasks();
                } else {
                    userId = null;
                    if(loginView) loginView.classList.remove('hidden');
                    if(userView) userView.classList.add('hidden');
                    if(mainContent) mainContent.classList.add('hidden');
                    if (unsubscribeTasks) unsubscribeTasks();
                    renderTasks([]);
                }
            });

            // --- Fungsi Path Collection ---
            const getTasksCollectionRef = (targetUserId) => { 
                const idToUse = targetUserId || userId; 
                if (!idToUse) return null;
                return collection(db, `artifacts/${appId}/users/${idToUse}/tasks`);
             };

            // --- Fungsi Hitung Skor (Dengan Pengecekan Weights) ---
            function calculatePriorityScore(urgency, pentingnya, time) {
                // *** PERBAIKAN: Gunakan default jika weights belum termuat ***
                const currentWeights = weights || defaultWeights; 
                if (!weights) {
                     console.warn("Bobot belum dimuat saat kalkulasi, menggunakan default.", defaultWeights);
                }
                
                const score = (Number(urgency) * currentWeights.urgency) + 
                              (Number(pentingnya) * currentWeights.pentingnya) + 
                              (Number(time) * currentWeights.time); 
                return parseFloat(score.toFixed(2));
            }


            // --- Fungsi Tambah Tugas ---
            const addNewTask = async (taskData) => { 
                 if (!userId) { alert("Error: Anda tidak terautentikasi."); return false;}
                try {
                    const urgency = Number(taskData.urgency);
                    const pentingnya = Number(taskData.pentingnya); 
                    const time = Number(taskData.time);

                    if (isNaN(urgency) || isNaN(pentingnya) || isNaN(time)) {
                        throw new Error("Data input (urgency/pentingnya/time) tidak valid.");
                    }
                    
                    const priorityScore = calculatePriorityScore(urgency, pentingnya, time);
                     if (isNaN(priorityScore)) {
                         throw new Error("Gagal menghitung skor prioritas. Cek nilai bobot.");
                     }
                    
                    const fullTaskData = {
                        name: taskData.name, urgency, pentingnya, time, 
                        priorityScore, status: 'pending', createdAt: serverTimestamp()
                    };

                    const collectionRef = getTasksCollectionRef(userId);
                    if (!collectionRef) throw new Error("Ref koleksi tidak valid.");
                    
                    console.log("[DEBUG] Menambah tugas:", fullTaskData, "dengan bobot:", weights || defaultWeights);
                    await addDoc(collectionRef, fullTaskData);
                    return true;
                } catch (error) { console.error("GAGAL MENAMBAHKAN TUGAS:", error); alert("GAGAL: " + error.message); return false; }
             };

            // --- Event Listener Form Manual ---
             safeAddEventListener('task-form', 'submit', async (e) => { /* ... (tidak berubah) ... */ });


            // --- Fungsi Login/Logout/Ekspor ---
            const signInWithGoogle = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(err => console.error(err));
            const signInAsGuest = () => signInAnonymously(auth).catch(err => console.error(err));
            const doSignOut = () => signOut(auth).catch(err => console.error(err));
            safeAddEventListener('login-button', 'click', signInWithGoogle);
            safeAddEventListener('guest-login-button', 'click', signInAsGuest);
            safeAddEventListener('logout-button', 'click', doSignOut);
            
            const exportSelectedUserCsv = async () => { /* ... (tidak berubah) ... */ };
            safeAddEventListener('download-button', 'click', exportSelectedUserCsv);


            // --- Fungsi Baca & Tampil Data ---
            function listenToTasks() { /* ... (tidak berubah) ... */ }
            function renderTasks(tasks) { 
                const taskListDiv = document.getElementById('task-list');
                const loadingP = document.getElementById('loading-tasks');
                if (!taskListDiv) return; // Keluar jika elemen task-list tidak ada

                if(loadingP) loadingP.style.display = 'none';
                if (tasks.length === 0) { 
                    taskListDiv.innerHTML = `<div class="text-center p-8 bg-white rounded-lg shadow-md"><h3 class="font-semibold text-lg">Tidak ada tugas!</h3><p class="text-slate-500 mt-1">Gunakan form manual atau chatbot (kanan bawah) untuk menambah tugas.</p></div>`; 
                    return;
                }
                
                tasks.sort((a, b) => (b.priorityScore ?? -Infinity) - (a.priorityScore ?? -Infinity)); // Handle null/undefined score

                taskListDiv.innerHTML = tasks.map(task => {
                    const currentWeights = weights || defaultWeights; // Gunakan default jika belum termuat
                    const priorityScoreNum = Number(task.priorityScore);
                    // Hitung batas dinamis berdasarkan bobot saat ini
                    const highThreshold = (5*currentWeights.urgency + 5*currentWeights.pentingnya + 1*currentWeights.time); 
                    const mediumThreshold = (3*currentWeights.urgency + 3*currentWeights.pentingnya + 3*currentWeights.time); 

                    const priorityText = isNaN(priorityScoreNum) ? 'N/A' :
                                       priorityScoreNum > highThreshold * 0.6 ? 'Tinggi' : 
                                       priorityScoreNum > highThreshold * 0.3 ? 'Sedang' : 'Rendah'; 
                    const priorityClass = isNaN(priorityScoreNum) ? 'priority-low' :
                                        priorityText === 'Tinggi' ? 'priority-high' :
                                        priorityText === 'Sedang' ? 'priority-medium' : 'priority-low';
                    const scoreDisplay = isNaN(priorityScoreNum) ? 'NaN' : priorityScoreNum.toFixed(1);

                    return `
                    <div class="task-card bg-white p-4 rounded-xl shadow-md flex items-start gap-4 ${task.status === 'completed' ? 'opacity-60' : ''}">
                        <input type="checkbox" onchange="window.toggleTaskStatus('${task.id}', '${task.status}')" class="mt-1.5 h-5 w-5 rounded" ${task.status === 'completed' ? 'checked' : ''}>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start">
                               <p class="font-semibold text-lg ${task.status === 'completed' ? 'line-through' : ''}">${task.name || 'Nama Tugas Hilang'}</p>
                               <span class="priority-badge ${priorityClass}">${priorityText} (${scoreDisplay})</span>
                            </div>
                            <div class="text-sm text-slate-500 mt-2 flex gap-4 flex-wrap">
                                <span>Urgensi: <strong>${task.urgency ?? 'N/A'}</strong></span>
                                <span>Pentingnya: <strong>${task.pentingnya ?? 'N/A'}</strong></span> 
                                <span>Waktu: <strong>${task.time ?? 'N/A'} jam</strong></span>
                            </div>
                        </div>
                        <button onclick="window.deleteTask('${task.id}')" class="text-slate-400 hover:text-red-500 p-1">

            function saveWeights(newWeights) { 
                 // Validasi sederhana
                 if (typeof newWeights?.urgency !== 'number' || typeof newWeights?.pentingnya !== 'number' || typeof newWeights?.time !== 'number') {
                     console.error("Bobot baru tidak valid:", newWeights);
                     alert("Gagal menyimpan bobot: Format tidak valid.");
                     return;
                 }
                 try {
                     localStorage.setItem('prioritaskWeights', JSON.stringify(newWeights));
                     weights = newWeights; // Update variabel global
                     console.log("Bobot baru disimpan:", weights);
                     displayCurrentWeights();
                     if (userId) listenToTasks(); // Muat ulang daftar tugas
                 } catch (error) {
                     console.error("Gagal menyimpan bobot ke localStorage:", error);
                     alert("Gagal menyimpan pengaturan bobot.");
                 }
            }

            // *** PERBAIKAN: Fungsi loadWeights ***
            function loadWeights() { 
                try {
                    const savedWeights = localStorage.getItem('prioritaskWeights');
                    if (savedWeights) {
                        const parsedWeights = JSON.parse(savedWeights);
                         // Validasi sederhana setelah parsing
                         if (typeof parsedWeights?.urgency === 'number' && typeof parsedWeights?.pentingnya === 'number' && typeof parsedWeights?.time === 'number') {
                             weights = parsedWeights;
                             console.log("Bobot dimuat dari localStorage:", weights);
                         } else {
                              console.warn("Data bobot di localStorage tidak valid, menggunakan default.");
                              weights = { ...defaultWeights }; // Gunakan salinan default
                         }
                    } else {
                        weights = { ...defaultWeights }; // Gunakan salinan default
                        console.log("Tidak ada bobot tersimpan, menggunakan default:", weights);
                    }
                } catch (error) {
                     console.error("Gagal memuat bobot dari localStorage:", error);
                     weights = { ...defaultWeights }; // Fallback ke default jika ada error
                }
                displayCurrentWeights(); // Selalu panggil display setelah mencoba load
                
                // Update tampilan di modal AHP
                const calculatedWeightsDisplay = document.getElementById('calculated-weights-display');
                 if(calculatedWeightsDisplay) {
                     calculatedWeightsDisplay.textContent = weights ? `Bobot aktif: U=${weights.urgency}, P=${weights.pentingnya}, W=${weights.time}` : 'Bobot belum termuat';
                 }
            }

            // *** PERBAIKAN: Fungsi displayCurrentWeights ***
            function displayCurrentWeights() { 
                const displayElement = document.getElementById('current-weights-display');
                 if (displayElement) {

                     } else {
                         displayElement.textContent = `Bobot saat ini: (Menggunakan Default)`;
                         console.warn("displayCurrentWeights dipanggil saat weights tidak valid.");
                     }
                 }
            }
