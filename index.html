<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .task-card { transition: all 0.3s ease; }
        .task-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        .completed { text-decoration: line-through; opacity: 0.6; }
        .priority-badge { font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 9999px; }
        .priority-high { background-color: #FECACA; color: #991B1B; }
        .priority-medium { background-color: #FEF3C7; color: #92400E; }
        .priority-low { background-color: #D1FAE5; color: #065F46; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="app-container" class="max-w-4xl mx-auto p-4 md:p-8">
        
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-900">Prio</h1>
            <p class="mt-2 text-slate-600">Fokus pada hal yang paling penting, sekarang juga.</p>
        </header>

        <!-- UI Login -->
        <div id="auth-container" class="mb-6 text-center">
             <div id="login-view">
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <button id="login-button" class="bg-white text-slate-700 font-semibold py-2 px-6 border border-slate-300 rounded-lg shadow-sm hover:bg-slate-100 transition-colors flex items-center justify-center w-full sm:w-auto">
                        <svg class="w-5 h-5 mr-3" viewBox="0 0 48 48" width="48px" height="48px"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.574l6.19,5.238C39.902,36.632,44,30.852,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path></svg>
                        Login dengan Google
                    </button>
                    <button id="guest-login-button" class="bg-slate-600 text-white font-semibold py-2 px-6 rounded-lg shadow-sm hover:bg-slate-700 transition-colors w-full sm:w-auto">
                        Masuk sebagai Tamu
                    </button>
                </div>
            </div>
            <div id="user-view" class="hidden">
                 <p class="text-sm text-slate-500 mb-2">Login sebagai <strong id="user-email"></strong></p>
                 <button id="logout-button" class="bg-red-500 text-white font-semibold py-1 px-4 text-sm rounded-lg hover:bg-red-600 transition-colors">Logout</button>
            </div>
        </div>

        <!-- Konten Utama -->
        <main id="main-content" class="hidden">
            <div class="bg-white p-6 rounded-xl shadow-md mb-8">
                <h2 class="text-xl font-semibold mb-4">Tambah Tugas Baru</h2>
                <!-- Form input -->
                <form id="task-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2"><label for="task-name" class="block text-sm font-medium text-slate-700 mb-1">Nama Tugas</label><input type="text" id="task-name" placeholder="Contoh: Mengerjakan Bab 1 Skripsi" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                    <div><label for="task-urgency" class="block text-sm font-medium text-slate-700 mb-1">Urgensi (1-5)</label><input type="range" id="task-urgency" min="1" max="5" value="3" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"><span id="urgency-value" class="text-sm text-slate-500">3 (Sedang)</span></div>
                    <div><label for="task-importance" class="block text-sm font-medium text-slate-700 mb-1">Pentingnya (1-5)</label><input type="range" id="task-importance" min="1" max="5" value="3" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"><span id="importance-value" class="text-sm text-slate-500">3 (Cukup Penting)</span></div>
                    <div class="md:col-span-2"><label for="task-time" class="block text-sm font-medium text-slate-700 mb-1">Deadline Tugas (Jam)</label><input type="number" id="task-time" min="0.5" step="0.5" value="1" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                    <div class="md:col-span-2"><button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">Prioritaskan & Tambah</button></div>
                </form>
            </div>
            
            <div>
                <!-- Daftar Tugas & Panel Admin -->
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">Daftar Tugas Anda (Diurutkan)</h2>
                </div>

                <!-- BARU: Panel Admin untuk Download -->
                <div id="admin-panel" class="hidden bg-yellow-50 border border-yellow-200 p-4 rounded-lg mb-6">
                    <h3 class="text-lg font-semibold text-yellow-900">Panel Admin</h3>
                    <p class="text-sm text-yellow-700 mb-3">Pilih pengguna untuk mengunduh data tugas mereka.</p>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <select id="user-select-dropdown" class="flex-grow px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Memuat daftar pengguna...</option>
                        </select>
                        <button id="download-button" class="bg-green-600 text-white text-sm font-semibold py-2 px-4 rounded-lg hover:bg-green-700 transition-colors flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Download Data
                        </button>
                    </div>
                </div>

                <div id="task-list" class="space-y-4">
                    <p id="loading-tasks" class="text-slate-500 text-center">Memuat tugas...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp, doc, updateDoc, deleteDoc, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Membungkus semua logika di dalam 'DOMContentLoaded'
        document.addEventListener('DOMContentLoaded', () => {
            console.log("[DEBUG] Halaman HTML selesai dimuat. Memulai skrip.");

            // Konfigurasi Firebase
            const firebaseConfig = {
                apiKey: "AIzaSyC4WwUhxG5XROTr5lSHvhDS4zj2Lqmw1U0",
                authDomain: "asisten-tugas-pribadi.firebaseapp.com",
                projectId: "asisten-tugas-pribadi",
                storageBucket: "asisten-tugas-pribadi.appspot.com",
                messagingSenderId: "994319187177",
                appId: "1:994319187177:web:58ebbc1fce8645eabd4478"
            };
            
            // Inisialisasi
            let db, auth, userId, unsubscribeTasks;
            const appId = 'asisten-tugas-pribadi';
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            console.log("[DEBUG] Firebase diinisialisasi.");

            // --- Elemen UI ---
            const loginView = document.getElementById('login-view');
            const userView = document.getElementById('user-view');
            const mainContent = document.getElementById('main-content');
            const userEmailSpan = document.getElementById('user-email');
            const loginButton = document.getElementById('login-button');
            const logoutButton = document.getElementById('logout-button');
            const guestLoginButton = document.getElementById('guest-login-button');
            const taskForm = document.getElementById('task-form');
            const taskListDiv = document.getElementById('task-list');

            // BARU: Elemen Panel Admin
            const adminPanel = document.getElementById('admin-panel');
            const userSelectDropdown = document.getElementById('user-select-dropdown');
            const downloadButton = document.getElementById('download-button');

            // --- BARU: Fungsi untuk memuat daftar pengguna (hanya admin) ---
            const loadUserListForAdmin = async () => {
                console.log("[DEBUG] Memuat daftar pengguna untuk admin...");
                try {
                    const usersCollectionRef = collection(db, "users");
                    const snapshot = await getDocs(usersCollectionRef);
                    
                    userSelectDropdown.innerHTML = ''; // Kosongkan opsi 'loading'
                    
                    if (snapshot.empty) {
                        userSelectDropdown.innerHTML = '<option value="">Tidak ada pengguna ditemukan</option>';
                        return;
                    }

                    snapshot.forEach(doc => {
                        const userData = doc.data();
                        const userId = doc.id;
                        // Tampilkan email jika ada, jika tidak tampilkan ID Tamu
                        const userName = userData.email || `Tamu (${userId.substring(0, 8)}...)`;
                        
                        const option = document.createElement('option');
                        option.value = userId;
                        option.textContent = userName;
                        userSelectDropdown.appendChild(option);
                    });
                    
                    adminPanel.classList.remove('hidden'); // Tampilkan panel admin
                    
                } catch (error) {
                    console.error("[DEBUG] Gagal memuat daftar pengguna:", error);
                    // Ini kemungkinan besar error 'insufficient permissions' jika Rules salah
                    adminPanel.innerHTML = `<p class="text-red-600">Gagal memuat daftar pengguna. Pastikan Security Rules sudah benar.</p>`;
                    adminPanel.classList.remove('hidden');
                }
            };

            // --- Fungsi Cek Admin ---
            const checkAdminStatus = async (user) => {
                if (user.isAnonymous) return false;
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);
                return userDoc.exists() && userDoc.data().isAdmin === true;
            };

            // --- Otak Aplikasi: onAuthStateChanged ---
            onAuthStateChanged(auth, async (user) => {
                adminPanel.classList.add('hidden'); // Sembunyikan panel admin secara default
                if (user) {
                    userId = user.uid; 
                    userEmailSpan.innerHTML = user.isAnonymous ? `Tamu <span class="font-normal text-slate-400 text-xs">(${user.uid.substring(0, 6)}...)</span>` : user.email;
                    loginView.classList.add('hidden');
                    userView.classList.remove('hidden');
                    mainContent.classList.remove('hidden');
                    
                    // BARU: Cek admin dan muat daftar pengguna
                    if (await checkAdminStatus(user)) {
                        console.log("[DEBUG] Status Admin Dikonfirmasi.");
                        loadUserListForAdmin(); // Panggil fungsi untuk mengisi dropdown
                    }
                    
                    listenToTasks();
                } else {
                    userId = null;
                    loginView.classList.remove('hidden');
                    userView.classList.add('hidden');
                    mainContent.classList.add('hidden');
                    if (unsubscribeTasks) unsubscribeTasks();
                    renderTasks([]);
                }
            });

            // --- Fungsi Path Collection ---
            const getTasksCollectionRef = (targetUserId) => {
                // Gunakan targetUserId jika disediakan (untuk admin), jika tidak, gunakan userId yang sedang login
                const idToUse = targetUserId || userId; 
                if (!idToUse) {
                    console.error("[DEBUG] GAGAL: getTasksCollectionRef dipanggil tetapi ID pengguna adalah null!");
                    return null;
                }
                const path = `artifacts/${appId}/users/${idToUse}/tasks`;
                console.log(`[DEBUG] Menggunakan path collection: ${path}`);
                return collection(db, path);
            }

            // --- Fungsi Submit Form ---
            taskForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                // ... (Logika submit tidak berubah, sudah benar) ...
                if (!userId) {
                    alert("Error: Anda tidak terautentikasi.");
                    return;
                }
                const taskName = document.getElementById('task-name').value;
                const urgency = parseInt(document.getElementById('task-urgency').value);
                const importance = parseInt(document.getElementById('task-importance').value);
                const time = parseFloat(document.getElementById('task-time').value);
                const taskData = {
                    name: taskName,
                    urgency,
                    importance,
                    time,
                    priorityScore: parseFloat(((urgency * 3.5) + (importance * 2.5) - (time * 0.5)).toFixed(2)),
                    status: 'pending',
                    createdAt: serverTimestamp()
                };
                try {
                    const collectionRef = getTasksCollectionRef(userId); // Selalu tambah ke data milik sendiri
                    if (!collectionRef) throw new Error("Referensi koleksi tidak valid (userId null).");
                    await addDoc(collectionRef, taskData);
                    e.target.reset();
                    document.getElementById('urgency-value').textContent = '3 (Sedang)';
                    document.getElementById('importance-value').textContent = '3 (Cukup Penting)';
                } catch (error) {
                    console.error("GAGAL MENAMBAHKAN TUGAS:", error);
                    alert("GAGAL: " + error.message);
                }
            });

            // --- Fungsi Login/Logout ---
            const signInWithGoogle = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(err => console.error(err));
            const signInAsGuest = () => signInAnonymously(auth).catch(err => console.error(err));
            const doSignOut = () => signOut(auth).catch(err => console.error(err));
            loginButton.addEventListener('click', signInWithGoogle);
            guestLoginButton.addEventListener('click', signInAsGuest);
            logoutButton.addEventListener('click', doSignOut);

            // --- BARU: Fungsi Ekspor CSV untuk Pengguna Tertentu ---
            const exportSelectedUserCsv = async () => {
                const selectedUserId = userSelectDropdown.value;
                const selectedUserName = userSelectDropdown.options[userSelectDropdown.selectedIndex].text;

                if (!selectedUserId) {
                    alert("Silakan pilih seorang pengguna dari daftar.");
                    return;
                }

                console.log(`[DEBUG] Memulai ekspor untuk pengguna: ${selectedUserName} (${selectedUserId})`);

                try {
                    // 1. Ambil data tugas HANYA untuk pengguna yang dipilih
                    const tasksCollectionRef = getTasksCollectionRef(selectedUserId);
                    const tasksSnapshot = await getDocs(query(tasksCollectionRef));
                    
                    const tasks = [];
                    tasksSnapshot.forEach(doc => tasks.push({ id: doc.id, ...doc.data() }));

                    if (tasks.length === 0) {
                        alert(`Pengguna "${selectedUserName}" tidak memiliki data tugas untuk diunduh.`);
                        return;
                    }

                    // 2. Siapkan header dan baris data
                    const headers = ['ID Tugas', 'Nama Tugas', 'Urgensi', 'Pentingnya', 'Estimasi Waktu (Jam)', 'Skor Prioritas', 'Status', 'Tanggal Dibuat'];
                    const rows = tasks.map(task => {
                        const taskName = (task.name || '').includes(',') ? `"${task.name}"` : task.name;
                        const createdAt = task.createdAt ? new Date(task.createdAt.seconds * 1000).toLocaleString('id-ID') : 'N/A';
                        return [task.id, taskName, task.urgency, task.importance, task.time, task.priorityScore, task.status, createdAt].join(',');
                    });

                    // 3. Gabungkan dan picu unduhan
                    const csvContent = [headers.join(','), ...rows].join('\n');
                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement("a");
                    const url = URL.createObjectURL(blob);
                    const date = new Date().toISOString().slice(0, 10);
                    link.setAttribute("href", url);
                    link.setAttribute("download", `prioritask_data_${selectedUserName}_${date}.csv`);
                    link.style.visibility = 'hidden';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    console.log("[DEBUG] Ekspor selesai.");

                } catch (error) {
                    console.error("[DEBUG] Gagal mengunduh data:", error);
                    alert("Gagal mengunduh data. Pastikan Security Rules Anda mengizinkan admin membaca data pengguna lain.");
                }
            };
            downloadButton.addEventListener('click', exportSelectedUserCsv);

            // --- Fungsi Baca & Tampil Data ---
            function listenToTasks() {
                if (!userId) return;
                if (unsubscribeTasks) unsubscribeTasks();
                // Selalu tampilkan tugas milik pengguna yang sedang login
                const q = query(getTasksCollectionRef(userId)); 
                if (!q) return;
                unsubscribeTasks = onSnapshot(q, (snapshot) => {
                    let tasks = [];
                    snapshot.forEach((doc) => tasks.push({ id: doc.id, ...doc.data() }));
                    tasks.sort((a, b) => b.priorityScore - a.priorityScore);
                    renderTasks(tasks); 
                }, (error) => {
                    console.error("[DEBUG] Gagal mendengarkan data (listenToTasks):", error);
                });
            }
            
            // Fungsi renderTasks tidak berubah
            function renderTasks(tasks) {
                 const loadingP = document.getElementById('loading-tasks');
                 if(loadingP) loadingP.style.display = 'none';

                 if (tasks.length === 0) {
                    taskListDiv.innerHTML = `<div class="text-center p-8 bg-white rounded-lg shadow-md"><h3 class="font-semibold text-lg">Tidak ada tugas!</h3><p class="text-slate-500 mt-1">Tambahkan tugas baru di atas untuk memulai.</p></div>`;
                    return;
                }
                
                taskListDiv.innerHTML = tasks.map(task => {
                    const priorityClass = task.priorityScore > 15 ? 'priority-high' : (task.priorityScore > 8 ? 'priority-medium' : 'low');
                    const priorityText = task.priorityScore > 15 ? 'Tinggi' : (task.priorityScore > 8 ? 'Sedang' : 'Rendah');
                    
                    return `
                    <div class="task-card bg-white p-4 rounded-xl shadow-md flex items-start gap-4 ${task.status === 'completed' ? 'opacity-60' : ''}">
                        <input type="checkbox" onchange="window.toggleTaskStatus('${task.id}', '${task.status}')" class="mt-1.5 h-5 w-5 rounded" ${task.status === 'completed' ? 'checked' : ''}>
                        
                        <div class="flex-grow">
                            <div class="flex justify-between items-start">
                               <p class="font-semibold text-lg ${task.status === 'completed' ? 'line-through' : ''}">${task.name}</p>
                               <span class="priority-badge ${priorityClass}">${priorityText} (${task.priorityScore.toFixed(1)})</span>
                            </div>
                            <div class="text-sm text-slate-500 mt-2 flex gap-4">
                                <span>Urgensi: <strong>${task.urgency}</strong></span>
                                <span>Pentingnya: <strong>${task.importance}</strong></span>
                                <span>Waktu: <strong>${task.time} jam</strong></span>
                            </div>
                        </div>
                        
                        <button onclick="window.deleteTask('${task.id}')" class="text-slate-400 hover:text-red-500 p-1">
                            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 012 0v6a1 1 0 11-2 0V8z" clip-rule="evenodd" /></svg>
                        </button>
                    </div>`;
                }).join('');
            }
            
            // --- Slider & Fungsi Global ---
            const urgencySlider = document.getElementById('task-urgency');
            const importanceSlider = document.getElementById('task-importance');
            const urgencyValue = document.getElementById('urgency-value');
            const importanceValue = document.getElementById('importance-value');
            const urgencyLabels = { 1: 'Sangat Rendah', 2: 'Rendah', 3: 'Sedang', 4: 'Mendesak', 5: 'Sangat Mendesak' };
            const importanceLabels = { 1: 'Tidak Penting', 2: 'Kurang Penting', 3: 'Cukup Penting', 4: 'Penting', 5: 'Sangat Penting' };
            urgencySlider.addEventListener('input', () => { urgencyValue.textContent = `${urgencySlider.value} (${urgencyLabels[urgencySlider.value]})`; });
            importanceSlider.addEventListener('input', () => { importanceValue.textContent = `${importanceSlider.value} (${importanceLabels[importanceSlider.value]})`; });

            window.toggleTaskStatus = async (taskId, currentStatus) => {
                if (!userId) return;
                const newStatus = currentStatus === 'pending' ? 'completed' : 'pending';
                const taskDocRef = doc(db, `artifacts/${appId}/users/${userId}/tasks`, taskId);
                await updateDoc(taskDocRef, { status: newStatus });
            };
            window.deleteTask = async (taskId) => {
                if (!userId) return;
                if (confirm('Yakin ingin menghapus tugas ini?')) {
                    const taskDocRef = doc(db, `artifacts/${appId}/users/${userId}/tasks`, taskId);
                    await deleteDoc(taskDocRef);
                }
            };
        
        }); // Penutup 'DOMContentLoaded'
    </script>
</body>
</html>
