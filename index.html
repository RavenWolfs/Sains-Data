            // --- Fungsi Baca & Tampil Data ---
            // *** PERBAIKAN: Logging detail di listenToTasks ***
            function listenToTasks() { 
                 console.log("[DEBUG][LISTEN] Fungsi listenToTasks dipanggil."); // Log Awal
                 if (!userId) { console.warn("[WARN][LISTEN] userId null. Listener tidak dipasang."); return;}
                 if (!db) { console.error("[ERROR][LISTEN] DB tidak valid. Listener tidak dipasang."); return; } 
                 
                 if (unsubscribeTasks) {
                    console.log("[DEBUG][LISTEN] Melepaskan listener tugas lama.");
                    try { unsubscribeTasks(); } catch(e){ console.warn("[WARN][LISTEN] Gagal unsubscribe:", e); }
                    unsubscribeTasks = null;
                 }
                 
                 let collectionRef;
                 try {
                     collectionRef = getTasksCollectionRef(userId); 
                     if (!collectionRef) {
                         console.error("[ERROR][LISTEN] Gagal mendapatkan CollectionReference.");
                         return; 
                     }
                      console.log(`[DEBUG][LISTEN] Berhasil mendapatkan CollectionReference untuk path: ${collectionRef.path}`);
                 } catch (error) {
                     console.error("[ERROR][LISTEN] Error saat memanggil getTasksCollectionRef:", error);
                     return;
                 }

                 let q;
                 try {
                     q = query(collectionRef); 
                     if (!q) { 
                         console.error("[ERROR][LISTEN] Fungsi query() mengembalikan nilai falsy.");
                         return; 
                     }
                     console.log("[DEBUG][LISTEN] Berhasil membuat query.");
                 } catch (error) {
                     console.error("[ERROR][LISTEN] Error saat memanggil query():", error);
                     return;
                 }
                 
                 console.log(`[DEBUG][LISTEN] Memasang listener onSnapshot...`);
                 try {
                     unsubscribeTasks = onSnapshot(q, (snapshot) => {
                         console.log(`[DEBUG][LISTEN] Snapshot diterima. Dokumen: ${snapshot.size}`);
                         let tasks = [];
                         snapshot.forEach((doc) => {
                             // Log data mentah
                             // console.log(`[DEBUG][LISTEN] Data Dokumen (${doc.id}):`, doc.data()); 
                             tasks.push({ id: doc.id, ...doc.data() });
                         });
                         console.log(`[DEBUG][LISTEN] Memanggil renderTasks dengan ${tasks.length} tugas.`);
                         renderTasks(tasks); // Panggil render
                     }, (error) => {
                         // Ini akan menangkap error permissions saat MEMBACA
                         console.error("[ERROR][LISTEN] Gagal mendengarkan data (callback error onSnapshot):", error);
                         const taskListDiv = document.getElementById('task-list');
                         if (taskListDiv) taskListDiv.innerHTML = `<p class="text-red-500 text-center">Gagal memuat tugas: ${error.message}. Coba refresh.</p>`;
                     });
                     console.log("[DEBUG][LISTEN] Listener onSnapshot berhasil dipasang.");
                 } catch (error) {
                     console.error("[ERROR][LISTEN] Gagal memasang listener onSnapshot:", error);
                     alert("Gagal terhubung ke update data tugas. Cek Console.");
                 }
             }

            // *** PERBAIKAN: Logging detail di renderTasks ***
            function renderTasks(tasks) { 
                console.log("[DEBUG][RENDER] Fungsi renderTasks dipanggil dengan data:", tasks); // Log data yang diterima
                const taskListDiv = document.getElementById('task-list');
                const loadingP = document.getElementById('loading-tasks');
                if (!taskListDiv) {
                    console.error("[ERROR][RENDER] Elemen #task-list tidak ditemukan!");
                    return; 
                }

                try { // Bungkus logika render dalam try-catch
                    if(loadingP) {
                         loadingP.style.display = 'none'; // Sembunyikan loading
                         console.log("[DEBUG][RENDER] Menyembunyikan #loading-tasks.");
                     } else {
                          console.warn("[WARN][RENDER] Elemen #loading-tasks tidak ditemukan saat render.");
                     }

                    if (!Array.isArray(tasks)) {
                         console.error("[ERROR][RENDER] Data tugas bukan array!", tasks);
                         taskListDiv.innerHTML = `<p class="text-red-500 text-center">Error: Data tugas tidak valid.</p>`;
                         return;
                    }

                    if (tasks.length === 0) { 
                        console.log("[DEBUG][RENDER] Tidak ada tugas, menampilkan pesan kosong.");
                        taskListDiv.innerHTML = `<div class="text-center p-8 bg-white rounded-lg shadow-md"><h3 class="font-semibold text-lg">Tidak ada tugas!</h3><p class="text-slate-500 mt-1">Gunakan form manual atau chatbot (kanan bawah) untuk menambah tugas.</p></div>`; 
                        return;
                    }
                    
                    console.log("[DEBUG][RENDER] Melakukan sorting tugas...");
                    tasks.sort((a, b) => (b.priorityScore ?? -Infinity) - (a.priorityScore ?? -Infinity)); 
                    console.log("[DEBUG][RENDER] Sorting selesai.");

                    console.log("[DEBUG][RENDER] Memulai mapping tugas ke HTML...");
                    taskListDiv.innerHTML = tasks.map((task, index) => {
                         // console.log(`[DEBUG][RENDER] Merender tugas #${index + 1}:`, task); // Log detail setiap tugas (opsional, bisa sangat banyak)
                        const priorityScoreNum = Number(task.priorityScore);
                        const urgency = Number(task.urgency);
                        const pentingnya = Number(task.pentingnya);
                        const time = Number(task.time);

                        // Pengecekan data sebelum render
                         if (!task.name || isNaN(urgency) || isNaN(pentingnya) || isNaN(time) || isNaN(priorityScoreNum)) {
                              console.warn(`[WARN][RENDER] Data tugas tidak lengkap/valid pada indeks ${index}:`, task);
                              // Tampilkan pesan error untuk item ini saja
                               return `<div class="task-card bg-red-100 p-4 rounded-xl shadow-md text-red-700">Error: Data tugas tidak valid (ID: ${task.id})</div>`;
                          }


                        // Kembali menggunakan batas hardcoded
                        const priorityText = priorityScoreNum > 15 ? 'Tinggi' :
                                           priorityScoreNum > 8 ? 'Sedang' : 'Rendah';
                        const priorityClass = priorityText === 'Tinggi' ? 'priority-high' :
                                            priorityText === 'Sedang' ? 'priority-medium' : 'priority-low';
                        const scoreDisplay = priorityScoreNum.toFixed(1);

                        return `
                        <div class="task-card bg-white p-4 rounded-xl shadow-md flex items-start gap-4 ${task.status === 'completed' ? 'opacity-60' : ''}">
                            <input type="checkbox" onchange="window.toggleTaskStatus('${task.id}', '${task.status}')" class="mt-1.5 h-5 w-5 rounded" ${task.status === 'completed' ? 'checked' : ''}>
                            <div class="flex-grow">
                                <div class="flex justify-between items-start">
                                   <p class="font-semibold text-lg ${task.status === 'completed' ? 'line-through' : ''}">${task.name}</p>
                                   <span class="priority-badge ${priorityClass}">${priorityText} (${scoreDisplay})</span>
                                </div>
                                <div class="text-sm text-slate-500 mt-2 flex gap-4 flex-wrap">
                                    <span>Urgensi: <strong>${urgency}</strong></span>
                                    <span>Pentingnya: <strong>${pentingnya}</strong></span> 
                                    <span>Waktu: <strong>${time} jam</strong></span>
                                </div>
                            </div>
                            <button onclick="window.deleteTask('${task.id}')" class="text-slate-400 hover:text-red-500 p-1">
                                <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 012 0v6a1 1 0 11-2 0V8z" clip-rule="evenodd" /></svg>
                            </button>
                        </div>`;
                    }).join('');
                     console.log("[DEBUG][RENDER] Render HTML selesai.");
                } catch (renderError) {
                     console.error("!!! ERROR [RENDER]: Terjadi kesalahan saat merender tugas !!!", renderError);
                     taskListDiv.innerHTML = `<p class="text-red-500 text-center">Terjadi error saat menampilkan tugas. Cek Console.</p>`;
                }
            }
            
            
            // --- Fungsi Global (onclick) ---
            window.toggleTaskStatus = async (taskId, currentStatus) => { /* ... */ };
            window.deleteTask = async (taskId) => { /* ... */ };
            
            // --- LOGIKA CHATBOT AI ---
