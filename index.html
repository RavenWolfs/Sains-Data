    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .task-card { transition: all 0.3s ease; }
        .task-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        .completed { text-decoration: line-through; opacity: 0.6; }
        .priority-badge { font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 9999px; }
        .priority-high { background-color: #FECACA; color: #991B1B; }
        .priority-medium { background-color: #FEF3C7; color: #92400E; }
        .priority-low { background-color: #D1FAE5; color: #065F46; }

        /* Gaya tambahan */
        #chatbot-fab, #settings-fab { position: fixed; bottom: 2rem; transition: all 0.3s ease; z-index: 40; }
        #chatbot-fab { right: 2rem; }
        #settings-fab { right: 6.5rem; }
        #chatbot-fab:hover, #settings-fab:hover { transform: scale(1.1); }
        #chatbot-modal, #settings-modal { background-color: rgba(0, 0, 0, 0.5); }
        .chat-bubble { max-width: 80%; padding: 0.75rem 1rem; border-radius: 1rem; }
        .chat-bubble-user { background-color: #3B82F6; color: white; border-bottom-right-radius: 0.25rem; align-self: flex-end; }
        .chat-bubble-bot { background-color: #E5E7EB; color: #1F2937; border-bottom-left-radius: 0.25rem; align-self: flex-start; }
        .comparison-label { width: 100px; text-align: right; }
        .comparison-slider { flex-grow: 1; margin: 0 1rem; }
    </style>
</head>

        // --- Fungsi utilitas aman ---
        function safeAddEventListener(elementId, event, handler) {
            try {
                const element = document.getElementById(elementId);
                if (element) {
                    element.addEventListener(event, handler);
                    // console.log(`[DEBUG] Listener added for ${event} on #${elementId}`);
                } else {
                    // Jangan error kritis, cukup peringatan
                    console.warn(`[WARN] Elemen dengan ID "${elementId}" tidak ditemukan saat mencoba menambah listener.`);
                }
            } catch(e) {
                 console.error(`[ERROR] Gagal menambah listener ke #${elementId}:`, e);
            }
        }

            });
            safeAddEventListener('task-importance', 'input', (e) => { 
                const valueSpan = document.getElementById('importance-value');

            // --- Otak Aplikasi: onAuthStateChanged ---
            console.log("[DEBUG] Memasang listener onAuthStateChanged...");
            onAuthStateChanged(auth, async (user) => {
                console.log("[DEBUG] onAuthStateChanged terpanggil. User:", user ? `UID: ${user.uid.substring(0,5)}...` : 'null');
                 
                 // Selalu sembunyikan elemen dinamis di awal
                 if(adminPanel) adminPanel.classList.add('hidden');
                 if(chatbotFab) chatbotFab.classList.add('hidden');
                 if(settingsFab) settingsFab.classList.add('hidden');
                 if(mainContent) mainContent.classList.add('hidden'); // Sembunyikan main content juga
                 if(userView) userView.classList.add('hidden'); // Sembunyikan user view
                 if(loginView) loginView.classList.add('hidden'); // Sembunyikan login view

                if (user) {
                    userId = user.uid; 
                    if(userEmailSpan) userEmailSpan.innerHTML = user.isAnonymous ? `Tamu (${user.uid.substring(0, 6)}...)` : user.email;
                    // Tampilkan UI yang relevan untuk user login
                    if(userView) userView.classList.remove('hidden');
                    if(mainContent) mainContent.classList.remove('hidden');
                    if(chatbotFab) chatbotFab.classList.remove('hidden'); 
                    if(settingsFab) settingsFab.classList.remove('hidden'); 
                    
                    if (await checkAdminStatus(user)) {
                        loadUserListForAdmin(); 
                    }
                    loadWeights(); 
                    listenToTasks();
                } else {
                    userId = null;
                     // Tampilkan UI login jika tidak ada user
                     if(loginView) loginView.classList.remove('hidden'); 
                    if (unsubscribeTasks) {
                        unsubscribeTasks(); 
                        unsubscribeTasks = null;
                        console.log("[DEBUG] Unsubscribed dari listener tugas.");
                    }
                    renderTasks([]); // Kosongkan daftar tugas
                }
            }, (error) => {
                 // --- DEBUGGING: Tangkap error pada listener auth ---
                 console.error("!!! KRITIS: Error pada onAuthStateChanged !!!", error);
                 alert("Terjadi error saat memeriksa status login. Cek Console (F12).");
            });

            // --- Fungsi Login/Logout/Ekspor ---
            const signInWithGoogle = () => { console.log("[DEBUG] Tombol Login Google diklik."); signInWithPopup(auth, new GoogleAuthProvider()).catch(err => console.error("Google Sign-In Error:", err)); }
            const signInAsGuest = () => { console.log("[DEBUG] Tombol Login Tamu diklik."); signInAnonymously(auth).catch(err => console.error("Guest Sign-In Error:", err)); }
            const doSignOut = () => { console.log("[DEBUG] Tombol Logout diklik."); signOut(auth).catch(err => console.error("Sign Out Error:", err)); }
            safeAddEventListener('login-button', 'click', signInWithGoogle);
            safeAddEventListener('guest-login-button', 'click', signInAsGuest);
            safeAddEventListener('logout-button', 'click', doSignOut);
            
            const exportSelectedUserCsv = async () => { /* ... */ };

            // --- Fungsi Baca & Tampil Data ---
            function listenToTasks() { 
                 if (!userId) { console.warn("[WARN] listenToTasks dipanggil saat userId null."); return;}
                 if (unsubscribeTasks) {
                    console.log("[DEBUG] Melepaskan listener tugas lama.");
                    unsubscribeTasks(); // Pastikan listener lama dilepas
                 }
                 const q = query(getTasksCollectionRef(userId)); 
                 if (!q) { console.error("[ERROR] Gagal membuat query untuk listenToTasks."); return; }
                 
                 console.log(`[DEBUG] Memasang listener snapshot ke path: ${getTasksCollectionRef(userId)?.path}`);
                 unsubscribeTasks = onSnapshot(q, (snapshot) => {
                     console.log(`[DEBUG] Menerima update snapshot. Jumlah dokumen: ${snapshot.size}`);
                     let tasks = [];
                     snapshot.forEach((doc) => tasks.push({ id: doc.id, ...doc.data() }));
                     renderTasks(tasks); 
                 }, (error) => {
                     console.error("[ERROR] Gagal mendengarkan data (onSnapshot):", error);
                      // Tampilkan error ke pengguna jika perlu
                      const taskListDiv = document.getElementById('task-list');
                      if (taskListDiv) taskListDiv.innerHTML = `<p class="text-red-500 text-center">Gagal memuat tugas: ${error.message}. Coba refresh halaman.</p>`;

             }
            function renderTasks(tasks) { /* ... (fungsi render tidak berubah) ... */ }

            window.toggleTaskStatus = async (taskId, currentStatus) => { /* ... */ };

            // --- LOGIKA CHATBOT AI ---

            safeAddEventListener('compare-urgency-importance', 'input', () => updateComparisonLabel('compare-urgency-importance', 'compare-urgency-importance-label'));

            loadWeights();

        // --- Panggil fungsi utama SETELAH DOM siap ---
        if (document.readyState === 'loading') { // Jika DOM belum siap

        } else { // Jika DOM sudah siap
